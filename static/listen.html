<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SilentOS listener</title>
<style>body{font:16px system-ui;background:#101626;color:#eef3ff;max-width:600px;margin:3rem auto;padding:0 1.5rem}h1{font-size:2rem}p{color:#bdc9dd}button{background:#d2e3ff;border:0;border-radius:10px;padding:14px;font:inherit;color:#172039}li{padding:12px;background:#202d43;border-radius:10px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}#status{min-height:2em}ol{padding-left:25px}</style></head><body>
<h1>SilentOS listener</h1><p>Captions appear here after the speaker reviews and sends them. This demo does not transmit live video or microphone audio.</p><button id="enable">Enable voice</button> <button id="test">Test voice</button><p id="status" role="status">Connecting…</p><ol id="messages" aria-live="polite"></ol>
<script>
const parts=location.hash.slice(1).split('.');const [room,token]=parts;history.replaceState(null,'',location.pathname);let cursor=0,enabled=false,polling=true,ack=0;const $=id=>document.getElementById(id);
function say(text){if(!enabled||!('speechSynthesis' in window))return;const utterance=new SpeechSynthesisUtterance(text);utterance.onerror=()=>{$('status').textContent='Voice playback failed. Captions remain available.'};speechSynthesis.speak(utterance);}
$('enable').onclick=()=>{if(!('speechSynthesis' in window)){ $('status').textContent='Speech synthesis unavailable. Captions remain available.';return;}enabled=true;speechSynthesis.resume();say('Voice enabled');$('status').textContent='Voice enabled. Waiting for captions.';};
$('test').onclick=()=>{if(!enabled){$('status').textContent='Tap Enable voice first.';return;}say('SilentOS voice test');};
async function tick(){if(!polling)return;try{const res=await fetch(`/api/room/poll?room=${encodeURIComponent(room)}&role=listener&after=${cursor}`,{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});const data=await res.json();if(!res.ok){polling=false;throw Error(data.error||'Room unavailable');}
for(const msg of data.messages){if(msg.id<=cursor)continue;const li=document.createElement('li');li.textContent=msg.text;$('messages').append(li);cursor=msg.id;say(msg.text);}
if(cursor>ack){const a=await fetch('/api/room/ack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room,token,id:cursor})});if(a.ok)ack=cursor;}
$('status').textContent=enabled?'Connected · Voice enabled':'Connected · Tap Enable voice. Messages received before enabling voice will appear as text only.';
}catch(e){$('status').textContent=`Connection problem: ${e.message}`;}if(polling)setTimeout(tick,1500);}
if(!room||!token){polling=false;$('status').textContent='Invalid invitation. Ask the speaker for a new link.';}else tick();
</script></body></html>
